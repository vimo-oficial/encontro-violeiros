<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Acesso da organização | Encontro de Violeiros</title>
<style>*{box-sizing:border-box}body{margin:0;background:#faf7f1;color:#142039;font-family:Arial,sans-serif;min-height:100dvh;display:grid;place-items:center;padding:24px}.card{width:min(100%,440px);background:#fffdf9;border:1px solid #d9bc7d;border-radius:20px;padding:32px;box-shadow:0 16px 60px #17233b0c}.brand{width:100%;height:auto;border-radius:10px}h1{font:700 28px Georgia,serif;margin-bottom:10px}p{color:#536073;line-height:1.6}label{display:block;font-weight:600;margin-top:22px}input{display:block;width:100%;margin-top:8px;padding:14px;border:1px solid #b6bcc6;border-radius:8px;font:inherit}input:focus-visible,a:focus-visible,button:focus-visible{outline:3px solid #d7a745;outline-offset:3px}button{width:100%;margin-top:26px;background:#173cbb;color:white;border:0;border-radius:8px;padding:15px;font:700 16px Arial;cursor:pointer}button:disabled{opacity:.6}a{display:block;text-align:center;color:#213c75;margin-top:24px}#error{color:#9b2525}small{display:block;text-align:center;color:#667;margin-top:20px}</style></head>
<body><main class="card"><img class="brand" src="/encontro-oficial.jpeg" alt="4º Encontro de Violeiros de Jales e Região"><h1>Acesso da organização</h1><p>Entre para gerenciar as inscrições, a recepção e o sorteio.</p><form id="login"><label for="username">Nome de usuário</label><input id="username" name="username" autocomplete="username" required minlength="3" maxlength="60" autocapitalize="none" spellcheck="false"><label for="password">Senha</label><input id="password" name="password" type="password" autocomplete="current-password" required minlength="6" maxlength="128"><p id="error" role="alert" hidden></p><button id="submit">Entrar</button></form><a href="/">Voltar ao evento</a><small>Acesso exclusivo aos organizadores autorizados.</small></main><script>
document.querySelector('#login').addEventListener('submit',async e=>{e.preventDefault();const button=document.querySelector('#submit'),error=document.querySelector('#error');button.disabled=true;button.textContent='Entrando…';error.hidden=true;try{const response=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:document.querySelector('#username').value,password:document.querySelector('#password').value})});const data=await response.json();if(!response.ok)throw Error(data.error||'Não foi possível entrar.');location.replace('/organizacao');}catch(e){error.textContent=e.message;error.hidden=false;button.disabled=false;button.textContent='Entrar';}});
</script></body></html>

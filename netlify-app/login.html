<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Acesso da organização | Encontro de Violeiros</title>
<style>*{box-sizing:border-box}body{margin:0;background:#faf7f1;color:#142039;font-family:Arial,sans-serif;min-height:100dvh;display:grid;place-items:center;padding:24px}.card{width:min(100%,460px);background:#fffdf9;border:1px solid #d9bc7d;border-radius:20px;padding:30px;box-shadow:0 16px 60px #17233b0c}.brand{width:100%;height:auto;border-radius:10px}h1{font:700 27px Georgia,serif;margin-bottom:10px}p{color:#536073;line-height:1.6}label{display:block;font-weight:600;margin-top:20px}input{display:block;width:100%;margin-top:8px;padding:14px;border:1px solid #b6bcc6;border-radius:8px;font:inherit}input:focus-visible,a:focus-visible,button:focus-visible{outline:3px solid #d7a745;outline-offset:3px}button{font:700 16px Arial;cursor:pointer}.primary{width:100%;margin-top:24px;background:#173cbb;color:white;border:0;border-radius:8px;padding:15px}button:disabled{opacity:.6}a{display:block;text-align:center;color:#213c75;margin-top:24px}.tabs{display:flex;gap:6px;border-bottom:1px solid #dfd6c5;margin-top:22px}.tabs button{flex:1;padding:13px 8px;border:0;background:transparent;color:#536073;border-bottom:3px solid transparent}.tabs button[aria-selected=true]{color:#173cbb;border-bottom-color:#173cbb}.notice{padding:12px;border-radius:8px;background:#fff0ed;color:#9b2525}.notice.success{background:#edf7ee;color:#225a31}small{display:block;color:#667;line-height:1.5;margin-top:8px}.foot{text-align:center;margin-top:20px}[hidden]{display:none!important}</style></head>
<body><main class="card"><img class="brand" src="/encontro-oficial.jpeg" alt="4º Encontro de Violeiros de Jales e Região"><h1>Acesso da organização</h1><div class="tabs" role="tablist" aria-label="Acesso de organizadores"><button id="loginTab" role="tab" aria-selected="true" aria-controls="accessPanel">Entrar</button><button id="registerTab" role="tab" aria-selected="false" aria-controls="accessPanel" tabindex="-1">Criar cadastro</button></div><section id="accessPanel" role="tabpanel" aria-labelledby="loginTab"><p id="intro">Entre para gerenciar as inscrições, a recepção e o sorteio.</p><form id="accessForm"><label for="username">Nome de usuário</label><input id="username" name="username" autocomplete="username" required minlength="3" maxlength="60" pattern="[a-zA-Z0-9._-]{3,60}" title="Use de 3 a 60 letras, números, pontos, traços ou sublinhados." autocapitalize="none" spellcheck="false"><small>Use letras sem acentos, números, ponto, traço ou sublinhado.</small><label for="password">Senha</label><input id="password" name="password" type="password" autocomplete="current-password" required minlength="6" maxlength="128"><small id="passwordHelp" hidden>Exatamente 6 dígitos numéricos. Exemplo de formato: 123456.</small><p id="notice" class="notice" role="status" aria-live="polite" hidden></p><button class="primary" id="submit">Entrar</button></form></section><a href="/">Voltar ao evento</a><small class="foot">Acesso exclusivo aos organizadores autorizados.</small></main><script>
const $=id=>document.getElementById(id);let mode='login';let busy=false;
function change(next){if(busy)return;mode=next;const signup=mode==='register';for(const id of ['loginTab','registerTab']){const active=id===(signup?'registerTab':'loginTab');$(id).setAttribute('aria-selected',String(active));$(id).tabIndex=active?0:-1;}$('accessPanel').setAttribute('aria-labelledby',signup?'registerTab':'loginTab');$('intro').textContent=signup?'Solicite seu acesso. Júlio analisará o pedido antes de liberar a entrada.':'Entre para gerenciar as inscrições, a recepção e o sorteio.';$('submit').textContent=signup?'Enviar pedido de cadastro':'Entrar';$('password').value='';$('password').autocomplete=signup?'new-password':'current-password';$('password').maxLength=signup?6:128;$('password').inputMode=signup?'numeric':'text';if(signup)$('password').pattern='[0-9]{6}';else $('password').removeAttribute('pattern');$('passwordHelp').hidden=!signup;$('notice').hidden=true;}
$('loginTab').onclick=()=>change('login');$('registerTab').onclick=()=>change('register');
for(const id of ['loginTab','registerTab'])$(id).addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight','Home','End'].includes(e.key)){e.preventDefault();const next=e.key==='Home'?'login':e.key==='End'?'register':mode==='login'?'register':'login';change(next);$(next==='login'?'loginTab':'registerTab').focus();}});
$('accessForm').addEventListener('submit',async e=>{e.preventDefault();if(busy)return;busy=true;$('submit').disabled=true;$('notice').hidden=true;$('submit').textContent=mode==='register'?'Enviando…':'Entrando…';try{const response=await fetch('/api/auth/'+mode,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:$('username').value.trim(),password:$('password').value})});const data=await response.json();if(!response.ok)throw Error(data.error||'Não foi possível concluir.');if(mode==='login'){location.replace('/organizacao');return;}$('notice').className='notice success';$('notice').textContent=data.message;$('password').value='';}catch(error){$('notice').className='notice';$('notice').textContent=error.message;}finally{busy=false;$('submit').disabled=false;$('submit').textContent=mode==='register'?'Enviar pedido de cadastro':'Entrar';$('notice').hidden=false;}});
</script></body></html>
